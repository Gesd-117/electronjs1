<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pagina de electron</title>
  <link rel="stylesheet" href="styles/output.css">
</head>

<body>
  <!-- Layout principal -->
  <div class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-2 shrink-0">
      <h1>Encabezado principal</h1>
    </header>
    <main class="bg-gray-300 flex-1 overflow-y-auto p-4">
      <div class="min-h-[82vh] bg-white p-8 rounded-2xl shadow-2xl shadow-gray-800">
        <div class="transition-all duration-300 w-full">
          <section class="py-4 px-2>
            <div class=" max-w-6xl mx-auto">
            <div class="max-w-4xl mx-auto">
              <div class="p-8 bg-gray-200 rounded-2xl shadow-lg">
                <div class="space-y-4">

                  <div class="relative flex justify-end gap-1.5">
                    <input type="text" id="name" placeholder=" "
                      class="peer w-full p-4 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
                    <label for="name"
                      class="absolute left-4 top-4 text-gray-500 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-1 peer-focus:text-sm peer-focus:text-blue-600 peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-sm peer-[:not(:placeholder-shown)]:text-primary-600">Ingresa
                      enlace del video</label>
                    <button
                      class="w-auto bg-blue-500 text-white p-4 rounded-lg font-semibold hover:bg-blue-600 transition-colors text-lg">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-info-icon lucide-info">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4" />
                        <path d="M12 8h.01" />
                      </svg>
                    </button>
                  </div>

                  <div class="flex justify-center">
                    <button
                      class="w-100 bg-blue-500 text-white p-4 rounded-lg font-semibold hover:bg-blue-600 transition-colors text-lg">
                      Mostrar resoluciones de descarga
                    </button>
                  </div>

                  <div class="relative">
                    <textarea id="message" rows="4" placeholder=" "
                      class="peer w-full p-4 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors resize-none"></textarea>
                    <label for="message"
                      class="absolute left-4 top-4 text-gray-500 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-1 peer-focus:text-sm peer-focus:text-blue-600 peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-sm peer-[:not(:placeholder-shown)]:text-primary-600">Canales
                      de resolucion para descarga</label>
                  </div>

                  <div class="flex justify-center">
                    <button
                      class="w-100 bg-blue-500 text-white p-4 rounded-lg font-semibold hover:bg-blue-600 transition-colors text-lg">Descargar
                      video en resolucion selecionada

                    </button>
                  </div>
                </div>
              </div>
            </div>
        </div>
        </section>
      </div>

      <script type="module" src="/src/main.js"></script>
  </div>
  </main>

  <footer class="bg-gray-800 text-white p-2 shrink-0 flex justify-between items-center">
    <h3>Pie de página</h3>
  </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
